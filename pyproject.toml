[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loop"
version = "0.1.0"
description = "Closed-loop go-to-market learning engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "jax[cpu]",
    "numpyro",
    "arviz",
    "duckdb",
    "pyarrow",
    "fastapi",
    "uvicorn",
    "pydantic>=2.0",
    "anthropic",
    "joblib",
    "langdetect",
    "rich",
    "pytest",
    "httpx",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]


